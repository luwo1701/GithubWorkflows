name: Schedule Issue Creation

on:
#  schedule:
    # Runs every day at midnight (UTC)
 #   - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  issues: write  # Give write access to issues

jobs:
  create_issue:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true  # Force Node.js 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Sprint Number
        id: determine_sprint
        run: |
          finalization_date=$(date -d "tomorrow" +'%Y-%m-%d') # create finalization issues the day before the sprint review
          # Define sprint mapping using an associative array
          declare -A sprint_review_dates=(
              ["2025-02-05"]=23
              ["2025-02-06"]=24
              ["2025-02-19"]=24
              ["2025-02-20"]=25
              ["2025-03-05"]=25
              ["2025-03-06"]=26
              ["2025-03-19"]=26
              ["2025-03-20"]=27
              ["2025-04-02"]=27
              ["2025-04-03"]=28
              ["2025-04-16"]=28
              ["2025-04-17"]=29
              ["2025-04-30"]=29
              ["2025-05-01"]=30
              ["2025-05-14"]=30
              ["2025-05-15"]=31
              ["2025-05-28"]=31
              ["2025-05-29"]=32
              ["2025-06-11"]=32
              ["2025-06-12"]=33
              ["2025-06-25"]=33
              ["2025-06-26"]=34
              ["2025-07-09"]=34
              ["2025-07-10"]=35
              ["2025-07-23"]=35
              ["2025-07-24"]=36
              ["2025-08-06"]=36
              ["2025-08-07"]=37
              ["2025-08-20"]=37
              ["2025-08-21"]=38
              ["2025-09-03"]=38
              ["2025-09-04"]=40
              ["2025-09-17"]=40
              ["2025-09-18"]=41
              ["2025-10-01"]=41
              ["2025-10-02"]=42
              ["2025-10-15"]=42
              ["2025-10-16"]=43
              ["2025-10-29"]=43
              ["2025-10-30"]=44
              ["2025-11-12"]=44
              ["2025-11-13"]=45
              ["2025-11-26"]=45
              ["2025-12-01"]=46
              ["2025-12-17"]=46
              ["2025-12-18"]=47
              ["2026-01-05"]=47
          )
          if [[ -n "${sprint_review_dates[$finalization_date]}" ]]; then
            sprint_number=${sprint_review_dates[$finalization_date]:-"Unknown"}
          else
            echo "Don't make a sprint review issue for $finalization_date"
            exit 0
          fi

          echo "Sprint number for today ($finalization_date): $sprint_number"
          echo "sprint_number=$sprint_number" >> $GITHUB_ENV

      - name: Run Python Script to Create Issue on Hardcoded Dates
        if: env.sprint_number != 'Unknown' # Run only if a sprint number is determined
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPRINT_NUMBER: ${{ env.sprint_number }}
        run: |
          python3 .github/workflows/create_issue.py
